services:
  postgres:
    image: postgres:16-alpine
    container_name: clausify-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: clausify
      POSTGRES_PASSWORD: clausify_dev
      POSTGRES_DB: clausify_db
    ports:
      - "5432:5432"
    volumes:
      - clausify_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clausify -d clausify_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: clausify-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://clausify:clausify_dev@postgres:5432/clausify_db
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      PORT: 3000
      HOST: 0.0.0.0
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://localhost:8081}
    ports:
      - "3000:3000"

volumes:
  clausify_pgdata:
